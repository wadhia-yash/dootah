name: Compiler compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
  push:
    branches: [main, compiler-m1]
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37' 'platforms;android-36' 'build-tools;36.0.0'
      # Discover stable Maven releases and try existing ABI implementations first.
      # Promotion writes metadata only after all compiler/Compose/semantic suites pass.
      - run: python3 tools/compiler_compatibility.py --verify --promote
      - run: ./gradlew dootahCompilerMatrixCheck :dootah-contract:test :dootah-android:testDebugUnitTest :dootah-server:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-compatibility-evidence
          path: |
            build/compiler-compatibility/
            gradle/compiler-backends.properties
            gradle/compiler-features.properties
            gradle/compiler-compatibility-evidence.json
