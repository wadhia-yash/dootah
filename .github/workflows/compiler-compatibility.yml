name: Compiler compatibility
on:
  pull_request:
  push:
    branches: [main, compiler-m1]
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37' 'platforms;android-36' 'build-tools;36.0.0'
      # The Gradle matrix comes from compiler-backends.properties; CI has no second version list.
      - run: ./gradlew dootahCompilerMatrixCheck :dootah-contract:test :dootah-android:testDebugUnitTest :dootah-server:test --stacktrace
