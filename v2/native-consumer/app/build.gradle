plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.dootah'
}
android {
    namespace 'dev.dootah.consumer'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.dootah.consumer'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.7.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    buildTypes {
        debug { applicationIdSuffix '.validation' }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
dootah {
    appId = '7d041833-4ea6-48b4-b581-357626bf5d5e'
    updateUrl = 'https://updates.example.test/manifest'
    debugUpdateUrl = 'http://127.0.0.1:3100/manifest'
    channel = 'development'
    runtimeVersion = 'dootah-v2-logic-2'
    publicCertificate = file('update-certificate.pem')
    allowLocalHttp = true
    requireHooks = true // fixture gate: zero instrumented entry points fails the build
}
dependencies { implementation 'androidx.compose.material3:material3:1.3.1' }
