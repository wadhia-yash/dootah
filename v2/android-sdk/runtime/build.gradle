plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'dev.dootah.runtime'
    compileSdk 36
    defaultConfig {
        minSdk 29
        buildConfigField 'String', 'DOOTAH_SDK_VERSION', "\"${rootProject.dootahSdkVersion}\""
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.java.srcDir '../../portable/src/main/java'
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('bootstrap')
    sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('native-bootstrap')
}
tasks.register('copyBootstrap', Copy) {
    dependsOn ':app:createBundleReleaseJsAndAssets'
    from providers.provider { project(':app').tasks.named('createBundleReleaseJsAndAssets').get().jsBundleDir.get() }
    into layout.buildDirectory.dir('bootstrap')
    from(project(':expo').file('../LICENSE')) { into 'dootah-licenses'; rename { 'EXPO-LICENSE' } }
    from(rootProject.file('../node_modules/react-native/LICENSE')) { into 'dootah-licenses'; rename { 'REACT-NATIVE-LICENSE' } }
    doLast {
        if (!new File(destinationDir, 'index.android.bundle').isFile()) {
            throw new GradleException('Dootah runtime is missing its embedded Hermes bootstrap')
        }
    }
}
tasks.named('preBuild') { dependsOn 'copyBootstrap' }
tasks.register('copyNativeBootstrap', Sync) {
    dependsOn ':app:mergeReleaseNativeLibs'
    from providers.provider { project(':app').tasks.named('mergeReleaseNativeLibs').get().outputs.files }
    include '**/arm64-v8a/libappmodules.so'
    eachFile { path = 'arm64-v8a/libappmodules.so' }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('native-bootstrap')
    doLast {
        if (!new File(destinationDir, 'arm64-v8a/libappmodules.so').isFile()) {
            throw new GradleException('Dootah runtime is missing its native module registration bootstrap')
        }
    }
}
tasks.configureEach {
    if (name.endsWith('JniLibFolders')) dependsOn 'copyNativeBootstrap'
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    implementation 'androidx.javascriptengine:javascriptengine:1.0.0'
    // javascriptengine's Guava replaces listenablefuture:1.0 with an empty artifact at runtime; AGP then
    // forces that empty artifact onto consumer compile classpaths. Expose the same Guava so apps that
    // compile against ListenableFuture (for example WorkManager users) keep a consistent classpath.
    api 'com.google.guava:guava:31.1-android'
    implementation 'androidx.compose.foundation:foundation:1.7.8'
    implementation project(':expo')
    implementation project(':expo-brownfield')
    implementation project(':expo-updates')
    implementation project(':expo-eas-client')
    api 'com.facebook.react:react-android:0.86.3'
    implementation 'com.facebook.hermes:hermes-android:250829098.0.17'
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.activity:activity-compose:1.10.1'
    api 'androidx.compose.ui:ui:1.7.8'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
