// Export the actual resolved consumer graph and its POM evidence, without publishing it.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

def target = rootProject.findProject(':runtime-v2') ?: project
if (target != project) {
    tasks.register('dootahDistributionInventory') { dependsOn ':runtime-v2:dootahDistributionInventory' }
}
target.tasks.register('dootahDistributionInventory') {
    doLast {
        def destination = new File(providers.gradleProperty('dootahEvidence').get())
        destination.mkdirs()
        def configuration = target.configurations.getByName(target.name == 'runtime-v2' ? 'releaseRuntimeClasspath' : 'runtimeClasspath')
        def visited = [] as Set
        def exportPom
        exportPom = { String group, String module, String version ->
            def coordinate = "${group}:${module}:${version}"
            def name = coordinate.replace(':', '_') + '.pom'
            if (!visited.add(coordinate)) return name
            def result = target.dependencies.createArtifactResolutionQuery().forModule(group, module, version)
                .withArtifacts(MavenModule, MavenPomArtifact).execute()
            def componentResult = result.resolvedComponents.find()
            if (componentResult == null) throw new GradleException("No POM for ${coordinate}")
            def artifact = componentResult.getArtifacts(MavenPomArtifact).first()
            if (!(artifact instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult)) {
                throw new GradleException("Unresolved POM for ${coordinate}")
            }
            def file = new File(destination, name)
            file.bytes = artifact.file.bytes
            def xml = new groovy.xml.XmlSlurper().parse(file)
            if (xml.parent.size()) {
                exportPom(xml.parent.groupId.text(), xml.parent.artifactId.text(), xml.parent.version.text())
            }
            name
        }
        def records = configuration.incoming.resolutionResult.allComponents.findAll {
            it.id instanceof ModuleComponentIdentifier
        }.collect { component ->
            def id = component.id
            [component: "${id.group}:${id.module}:${id.version}", kind: 'transitive',
             pom: exportPom(id.group, id.module, id.version)]
        }.sort { it.component }
        new File(destination, target.name == 'runtime-v2' ? 'runtime-graph.json' : 'plugin-graph.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(records))
    }
}
