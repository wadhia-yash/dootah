plugins {
    id 'com.android.application' version '8.12.0'
    id 'org.jetbrains.kotlin.android' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}
android {
    namespace 'dev.dootah.v2.control'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.dootah.v2.control'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { compose true }
    signingConfigs {
        debug {
            storeFile file('../android/app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false; shrinkResources false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.compose.material3:material3:1.3.1'
}
